[project]
name = "pi-subagent"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = ["pi-agent", "pi-ai", "pydantic>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_subagent"]

[tool.uv.sources]
pi-agent = { git = "https://gitee.com/www6v6v/piPy.git", branch = "v0.3.0", subdirectory = "packages/pi_agent" }
pi-ai = { git = "https://gitee.com/www6v6v/piPy.git", branch = "v0.3.0", subdirectory = "packages/pi_ai" }
